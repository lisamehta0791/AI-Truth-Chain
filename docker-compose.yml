services:
  db:
    image: pgvector/pgvector:pg16
    container_name: cot_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chain_of_truth}
      # No default: a real password must come from .env, never from a value
      # committed to the repo. Compose errors out with this message if unset.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-chain_of_truth}
    ports:
      - "5433:5432"
    volumes:
      - cot_db_data:/var/lib/postgresql/data
      - ./database/init_pgvector.sql:/docker-entrypoint-initdb.d/init_pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chain_of_truth}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: cot_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - cot_minio_data:/data

  # backend and frontend are commented out for local dev-with-hot-reload by default —
  # uncomment to run the whole stack in containers instead of `uvicorn --reload` / `npm run dev`.
  # backend:
  #   build:
  #     context: ./backend
  #     dockerfile: ../docker/backend.Dockerfile
  #   env_file: .env
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   ports:
  #     - "8000:8000"
  #
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: ../docker/frontend.Dockerfile
  #   env_file: .env
  #   ports:
  #     - "5173:5173"

volumes:
  cot_db_data:
  cot_minio_data:
