[project]
name = "chain-of-truth-backend"
version = "0.1.0"
description = "AI-Assisted Evidence Integrity & Investigation System — backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.19",
    "pgvector>=0.2.5",
    "pydantic>=2.7.0",
    "email-validator>=2.1.0",
    "pydantic-settings>=2.3.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.1.0",
    "python-multipart>=0.0.9",
    "boto3>=1.34.0",
    "anthropic>=0.34.0",
    "groq>=0.11.0",
    "voyageai>=0.2.3",
    "websockets>=12.0",
    "pillow>=10.0",  # demo scenario illustrations (app/demo/images.py)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.setuptools]
packages = ["app"]